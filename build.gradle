plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = maven_group

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Devos Snapshot Maven'
        url = 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net/'
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Repsy Toma Maven'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'TheIllusiveC4 Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'Repsy'
        url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
    }
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Phoenix suite
    jarJar(implementation("net.phoenixvine.wiki:neoforge:${phoenix_wiki_version}")) {
        version { strictly "[${phoenix_wiki_version},)"; prefer phoenix_wiki_version }
    }

    // GregTech 8 and what it needs at runtime
    compileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}") { transitive = false }
    compileOnly("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    localRuntime "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtm_version}"
    localRuntime "brachy.modularui:modularui-mc${minecraft_version}:${mui_version}"
    localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"

    compileOnly "dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}"
    compileOnly("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}") { transitive = false }
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}") { transitive = false }
    compileOnly("maven.modrinth:embeddium:${embeddium_version}") { transitive = false }
    compileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    localRuntime("maven.modrinth:embeddium:${embeddium_version}") { transitive = false }
    localRuntime("maven.modrinth:terrafirmacraft:${tfc_version}") { transitive = false }
    localRuntime("maven.modrinth:patchouli:${patchouli_version}") { transitive = false }
    localRuntime("maven.modrinth:immersivepetroleum:${ip_version}") { transitive = false }
    localRuntime("maven.modrinth:extended-ae:${eae_version}") { transitive = false }
    localRuntime("maven.modrinth:advancedae:${aae_version}") { transitive = false }
    localRuntime("maven.modrinth:glodium:${glodium_version}") { transitive = false }
    localRuntime("blusunrize.immersiveengineering:ImmersiveEngineering:${ie_version}") { transitive = false }
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_version}") { transitive = false }
    localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    localRuntime "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

sourceSets {
    test {
        java.srcDirs = ['src/test/java']
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Repsy'
            url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
            credentials {
                username = project.findProperty('repsyUsername') ?: System.getenv('REPSY_USERNAME')
                password = project.findProperty('repsyPassword') ?: System.getenv('REPSY_PASSWORD')
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ── Phantasia Web Export ──────────────────────────────────────────────────────
// Extracts block textures, models, and blockstate JSONs from GTCEu + vanilla MC
// jars into docs/assets/mc/ so the GitHub Pages viewer can resolve block models.
//
// Run with:  ./gradlew extractWebTextures
// Output:    docs/assets/mc/assets/<namespace>/{blockstates,models,textures}/...
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('extractWebTextures') {
    group = 'phantasia web'
    description = 'Extracts block textures/models/blockstates from ALL mod jars to docs/assets/mc/'

    dependsOn configurations.runtimeClasspath

    doLast {
        def outputDir = file("docs/assets/mc")
        outputDir.mkdirs()

        // Match assets from ANY namespace — the MC client jar arrives under an
        // internal NeoGradle name (not 'net.minecraft'), so we can't filter by
        // group.  We filter by content pattern instead, which is just as safe.
        def includes = [
            'assets/*/blockstates/**',
            'assets/*/models/block/**',
            'assets/*/models/item/**',
            'assets/*/textures/block/**',
            'assets/*/textures/item/**',
            'assets/*/textures/gui/darkened/**',
        ]

        int jarCount = 0

        // Collect every .jar on the runtime classpath (mods + MC + Forge)
        def allJars = configurations.runtimeClasspath.resolvedConfiguration
            .resolvedArtifacts.collect { it.file }.findAll { it.name.endsWith('.jar') }

        // Also walk the local Gradle cache for the minecraft client jar that
        // NeoGradle downloads but may not expose as a resolvable artifact.
        def gradleHome = gradle.gradleUserHomeDir.absolutePath
        def mcCacheDir = new File("${gradleHome}/caches/")
        if (mcCacheDir.exists()) {
            mcCacheDir.eachFileRecurse { f ->
                if (f.name.endsWith('.jar') && (f.name.contains('minecraft') || f.name.contains('client'))
                        && !f.name.contains('sources') && !f.name.contains('javadoc')) {
                    allJars << f
                }
            }
        }

        allJars.unique { it.absolutePath }.each { jarFile ->
            try {
                def matchedFiles = zipTree(jarFile).matching { include includes }
                if (!matchedFiles.empty) {
                    copy { from matchedFiles; into outputDir }
                    jarCount++
                    logger.lifecycle("[extractWebTextures] ✓ ${jarFile.name}")
                }
            } catch (Exception e) {
                logger.debug("[extractWebTextures] skip ${jarFile.name}: ${e.message}")
            }
        }

        logger.lifecycle("[extractWebTextures] Done — ${jarCount} jars → ${outputDir}")
    }
}
